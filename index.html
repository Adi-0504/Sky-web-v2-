<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17383B">
  <title>空の曆 — Official World Archive</title>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

  <style>
    :root {
      --bg: #f3eee4;
      --surface: #fffdf8;
      --surface-soft: #e9e2d5;
      --ink: #213437;
      --muted: #718083;
      --deep: #17383b;
      --deep-2: #24565a;
      --accent: #c49b63;
      --line: rgba(33, 52, 55, 0.12);
      --shadow: 0 20px 60px rgba(25, 43, 45, 0.10);
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --max: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 10% 0%, rgba(196, 155, 99, 0.14), transparent 28%),
        radial-gradient(circle at 90% 10%, rgba(36, 86, 90, 0.10), transparent 30%),
        var(--bg);
      color: var(--ink);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "PingFang TC",
        "Noto Sans TC",
        sans-serif;
      line-height: 1.7;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ::selection {
      background: var(--accent);
      color: white;
    }

    .site-header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 100;
      height: 76px;
      background: rgba(243, 238, 228, 0.78);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid transparent;
      transition: 0.3s ease;
    }

    .site-header.scrolled {
      border-bottom-color: var(--line);
      box-shadow: 0 8px 30px rgba(20, 40, 42, 0.05);
    }

    .nav {
      width: min(var(--max), calc(100% - 40px));
      height: 100%;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--deep);
      font-size: 15px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-button,
    .language-button {
      border: 0;
      background: transparent;
      color: var(--ink);
      padding: 9px 12px;
      border-radius: 10px;
      transition: 0.2s ease;
    }

    .nav-button:hover,
    .language-button:hover {
      background: rgba(36, 86, 90, 0.08);
    }

    .language {
      position: relative;
    }

    .language-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 150px;
      padding: 7px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      display: none;
    }

    .language.open .language-menu {
      display: block;
    }

    .language-menu button {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 9px 11px;
      border-radius: 9px;
    }

    .language-menu button:hover {
      background: var(--surface-soft);
    }

    main {
      min-height: 100vh;
    }

    .page {
      width: min(var(--max), calc(100% - 40px));
      margin: auto;
      padding: 126px 0 80px;
    }

    .hero {
      min-height: 650px;
      display: grid;
      grid-template-columns: 1.25fr 0.75fr;
      gap: 40px;
      align-items: center;
    }

    .eyebrow {
      color: var(--deep-2);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(62px, 10vw, 128px);
      line-height: 0.95;
      letter-spacing: -0.075em;
      font-weight: 850;
    }

    .hero h1 span {
      display: block;
      color: var(--deep-2);
      font-size: 0.43em;
      letter-spacing: -0.025em;
      margin-top: 18px;
    }

    .hero-copy {
      max-width: 620px;
      color: var(--muted);
      font-size: 17px;
      margin: 32px 0;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .primary-button,
    .secondary-button {
      border-radius: 13px;
      padding: 12px 17px;
      font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .primary-button {
      color: white;
      background: var(--deep);
      border: 1px solid var(--deep);
    }

    .secondary-button {
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
    }

    .primary-button:hover,
    .secondary-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(20, 40, 42, 0.10);
    }

    .hero-visual {
      position: relative;
      min-height: 430px;
      border-radius: 40px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.48), transparent),
        var(--deep);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .hero-orbit {
      position: absolute;
      width: 360px;
      height: 360px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .hero-orbit::before,
    .hero-orbit::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.12);
    }

    .hero-orbit::before {
      inset: 45px;
    }

    .hero-orbit::after {
      inset: 105px;
    }

    .hero-island {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) rotate(-4deg);
      width: 180px;
      height: 105px;
      border-radius: 50%;
      background: #d7c29f;
      box-shadow:
        0 30px 0 -8px rgba(196, 155, 99, .4),
        0 40px 50px rgba(0,0,0,.2);
    }

    .hero-island::before {
      content: "";
      position: absolute;
      width: 90px;
      height: 90px;
      left: 45px;
      top: -42px;
      border-radius: 50%;
      background: #7eaa8e;
      box-shadow: inset 20px -12px rgba(40, 80, 65, .12);
    }

    .hero-stat {
      position: absolute;
      left: 26px;
      bottom: 24px;
      color: rgba(255,255,255,.75);
      font-size: 13px;
    }

    .hero-stat strong {
      display: block;
      color: white;
      font-size: 30px;
      line-height: 1.1;
    }

    .section {
      padding: 80px 0;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 30px;
      margin-bottom: 30px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1;
      letter-spacing: -0.055em;
    }

    .section-heading p {
      max-width: 430px;
      color: var(--muted);
      margin: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .island-card,
    .data-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: rgba(255, 253, 248, 0.78);
      box-shadow: 0 10px 40px rgba(30, 48, 50, 0.04);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .island-card:hover,
    .data-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }

    .island-card {
      min-height: 320px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .island-number {
      position: absolute;
      top: 24px;
      right: 25px;
      color: rgba(33,52,55,.22);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .island-shape {
      position: absolute;
      width: 190px;
      height: 105px;
      right: 35px;
      top: 62px;
      border-radius: 50%;
      opacity: .65;
      transform: rotate(-7deg);
    }

    .plain .island-shape {
      background: #c8ad7a;
    }

    .forest .island-shape {
      background: #719479;
    }

    .mine .island-shape {
      background: #7c7770;
    }

    .beach .island-shape {
      background: #d2ae73;
    }

    .island-card h3 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: -.04em;
    }

    .island-card p {
      margin: 0;
      max-width: 430px;
      color: var(--muted);
    }

    .island-tag {
      display: inline-flex;
      width: fit-content;
      margin-bottom: 12px;
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--surface-soft);
      font-size: 11px;
      font-weight: 800;
    }

    .archive-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .archive-card {
      min-height: 240px;
      padding: 25px;
      border-radius: var(--radius-lg);
      background: var(--deep);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform .25s ease;
    }

    .archive-card:hover {
      transform: translateY(-4px);
    }

    .archive-card:nth-child(2) {
      background: #365e5c;
    }

    .archive-card:nth-child(3) {
      background: #74644e;
    }

    .archive-card h3 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -.04em;
    }

    .archive-card p {
      color: rgba(255,255,255,.68);
      margin: 0;
    }

    .archive-arrow {
      font-size: 24px;
      opacity: .65;
    }

    .data-page-header {
      padding-bottom: 35px;
    }

    .data-page-header h1 {
      margin: 0 0 15px;
      font-size: clamp(42px, 7vw, 76px);
      line-height: 1;
      letter-spacing: -.065em;
    }

    .data-page-header p {
      max-width: 650px;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 25px 0;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 12px 15px;
      background: var(--surface);
      color: var(--ink);
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--deep-2);
    }

    .filter-button {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 13px;
      padding: 10px 14px;
    }

    .filter-button.active {
      background: var(--deep);
      color: white;
      border-color: var(--deep);
    }

    .data-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .data-card {
      padding: 22px;
      cursor: pointer;
    }

    .data-card small {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .data-card h3 {
      margin: 10px 0 6px;
      font-size: 24px;
      letter-spacing: -.04em;
    }

    .data-card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .status {
      display: inline-flex;
      margin-top: 17px;
      padding: 5px 8px;
      border-radius: 999px;
      background: #e7eee8;
      color: #41634b;
      font-size: 11px;
      font-weight: 800;
    }

    .record-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--line);
    }

    .record-table th,
    .record-table td {
      text-align: left;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    .record-table th {
      font-size: 12px;
      color: var(--muted);
      background: var(--surface-soft);
    }

    .record-table tr:last-child td {
      border-bottom: 0;
    }

    .detail-panel {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(20, 36, 38, .48);
      backdrop-filter: blur(8px);
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .detail-panel.open {
      display: flex;
    }

    .detail-sheet {
      width: min(900px, 100%);
      max-height: 86vh;
      overflow: auto;
      padding: 35px;
      background: var(--surface);
      border-radius: 30px 30px 0 0;
      box-shadow: 0 -20px 80px rgba(0,0,0,.2);
    }

    .detail-close {
      float: right;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: transparent;
    }

    .detail-sheet h2 {
      margin: 15px 0 10px;
      font-size: 42px;
      letter-spacing: -.055em;
    }

    .detail-sheet p {
      color: var(--muted);
    }

    .record-note {
      padding: 20px;
      border-radius: var(--radius-md);
      background: var(--surface-soft);
      margin-top: 20px;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: var(--radius-lg);
    }

    .footer {
      width: min(var(--max), calc(100% - 40px));
      margin: auto;
      padding: 30px 0 45px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .hero-visual {
        min-height: 340px;
      }

      .archive-grid,
      .data-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 680px) {
      .site-header {
        height: 68px;
      }

      .nav {
        width: min(var(--max), calc(100% - 24px));
      }

      .nav-links .nav-button:nth-child(n+3) {
        display: none;
      }

      .page {
        width: min(var(--max), calc(100% - 24px));
        padding-top: 105px;
      }

      .hero {
        min-height: auto;
        padding: 35px 0 50px;
      }

      .hero h1 {
        font-size: clamp(56px, 18vw, 90px);
      }

      .grid,
      .archive-grid,
      .data-grid {
        grid-template-columns: 1fr;
      }

      .section-heading {
        display: block;
      }

      .section-heading p {
        margin-top: 15px;
      }

      .record-table {
        display: block;
        overflow-x: auto;
      }

      .footer {
        display: block;
      }

      .footer > * + * {
        margin-top: 8px;
      }
    }
  </style>
</head>

    function render() {
      const path = location.hash.replace("#", "") || "/";

      let content;

      if (path === "/world") {
        content = worldPage();
      } else if (path === "/ingredients") {
        content = ingredientsPage();
      } else if (path === "/food") {
        content = foodPage();
      } else if (path === "/kuugo") {
        content = kuugoPage();
      } else {
        content = homePage();
      }

      document.getElementById("app").innerHTML = content;

      renderNav();
      bindRoutes();
      bindSearch();
      bindDetails();
      animatePage();
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function bindRoutes() {
      document.querySelectorAll("[data-route]").forEach(element => {
        element.addEventListener("click", event => {
          const route = element.dataset.route;

          if (route === "/") {
            location.hash = "/";
          } else {
            location.hash = route;
          }

          document.getElementById("languageMenu")
            .parentElement
            .classList.remove("open");
        });
      });
    }

    function bindSearch() {
      const searches = [
        ["ingredientSearch", "ingredientGrid"],
        ["kuugoSearch", "kuugoGrid"]
      ];

      searches.forEach(([inputId, gridId]) => {
        const input = document.getElementById(inputId);
        const grid = document.getElementById(gridId);

        if (!input || !grid) return;

        input.addEventListener("input", () => {
          const query = input.value.trim().toLowerCase();

          grid.querySelectorAll(".searchable").forEach(card => {
            const content = card.dataset.name.toLowerCase();
            card.style.display =
              !query || content.includes(query) ? "" : "none";
          });
        });
      });
    }

    function bindDetails() {
      document.querySelectorAll("[data-detail-type]").forEach(card => {
        card.addEventListener("click", () => {
          const type = card.dataset.detailType;
          const name = card.dataset.detailName;

          let item;

          if (type === "ingredient") {
            item = ingredients.find(entry => entry.name === name);

            if (!item) return;

            openDetail(`
              <div class="eyebrow">${item.category}</div>
              <h2>${item.name}</h2>
              <p>${item.description}</p>
              <span class="status">${i18n("正式")}</span>
            `);
          }

          if (type === "food") {
            item = foods.find(entry => entry.name === name);

            if (!item) return;

            openDetail(`
              <div class="eyebrow">${i18n(item.island)}</div>
              <h2>${item.name}</h2>
              <p>${item.description}</p>
              <span class="status">${i18n("正式")}</span>
            `);
          }
        });
      });
    }

    function openDetail(content) {
      const panel = document.getElementById("detailPanel");
      document.getElementById("detailContent").innerHTML = content;
      panel.classList.add("open");

      gsap.fromTo(
        ".detail-sheet",
        { y: 80, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }
      );
    }

    function closeDetail() {
      const panel = document.getElementById("detailPanel");

      gsap.to(".detail-sheet", {
        y: 80,
        opacity: 0,
        duration: 0.25,
        ease: "power2.in",
        onComplete: () => panel.classList.remove("open")
      });
    }

    function animatePage() {
      const items = document.querySelectorAll(
        ".hero-copy-block, .hero-visual, .section-heading, .island-card, .archive-card, .data-card, .record-table"
      );

      gsap.fromTo(
        items,
        {
          opacity: 0,
          y: 18
        },
        {
          opacity: 1,
          y: 0,
          duration: 0.65,
          stagger: 0.045,
          ease: "power3.out",
          clearProps: "transform"
        }
      );
    }

    window.addEventListener("hashchange", render);

    document.getElementById("detailClose")
      .addEventListener("click", closeDetail);

    document.getElementById("detailPanel")
      .addEventListener("click", event => {
        if (event.target.id === "detailPanel") {
          closeDetail();
        }
      });

    document.getElementById("languageButton")
      .addEventListener("click", () => {
        document.querySelector(".language").classList.toggle("open");
      });

    document.querySelectorAll("[data-language]").forEach(button => {
      button.addEventListener("click", () => {
        setLanguage(button.dataset.language);
        document.querySelector(".language").classList.remove("open");
      });
    });

    window.addEventListener("scroll", () => {
      document
        .getElementById("siteHeader")
        .classList.toggle("scrolled", window.scrollY > 20);
    });

    render();
  </script>
