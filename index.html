<html lang="zh-Hant">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>空の曆｜官方世界觀資料庫</title>

  <!-- Fonts -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"

  <style>
    /* =========================================================
       DESIGN TOKENS
       ========================================================= */

    :root {
      --color-background: #CBC4B4;
      --color-background-soft: #D8D1C2;
      --color-surface: #F1EDE4;
      --color-surface-strong: #E7DFD0;

      --color-primary: #B4BDCB;
      --color-secondary: #CBC0B4;

      --color-text: #391500;
      --color-text-soft: #6D5A4D;
      --color-text-muted: #8B7C70;

      --color-border: rgba(57, 21, 0, 0.12);
      --color-border-strong: rgba(57, 21, 0, 0.2);

      --radius-small: 12px;
      --radius-medium: 20px;
      --radius-large: 30px;

      --shadow-soft:
        0 12px 40px rgba(57, 21, 0, 0.08);

      --content-width: 1180px;

      --font-sans:
        "Noto Sans TC",
        "Noto Sans JP",
        "Noto Sans KR",
        system-ui,
        sans-serif;
    }

    /* =========================================================
       RESET
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--color-background);
      color: var(--color-text);
      font-family: var(--font-sans);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================================
       APP SHELL
       ========================================================= */

    #app {
      min-height: 100vh;
      overflow-x: hidden;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;

      border-bottom: 1px solid var(--color-border);

      background:
        rgba(203, 196, 180, 0.88);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .header-inner {
      width: min(
        calc(100% - 40px),
        var(--content-width)
      );

      min-height: 76px;
      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;

      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .brand-mark {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      border-radius: 50%;
      background: var(--color-primary);
    }

    .brand-mark svg {
      width: 21px;
      height: 21px;
      stroke-width: 1.8;
    }

    .brand-name {
      font-size: 1.05rem;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-link {
      border: 0;
      background: transparent;

      padding: 9px 13px;
      border-radius: 12px;

      color: var(--color-text-soft);
      transition:
        background 180ms ease,
        color 180ms ease;
    }

    .nav-link:hover,
    .nav-link.active {
      background: rgba(241, 237, 228, 0.72);
      color: var(--color-text);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .language-select {
      border: 1px solid var(--color-border);
      border-radius: 12px;

      padding: 8px 10px;

      background: rgba(241, 237, 228, 0.65);
      color: var(--color-text);

      outline: none;
    }

    .mobile-menu-button {
      display: none;

      width: 42px;
      height: 42px;

      border: 0;
      border-radius: 12px;

      background: rgba(241, 237, 228, 0.72);
      color: var(--color-text);
    }

    /* =========================================================
       MAIN
       ========================================================= */

    main {
      width: min(
        calc(100% - 40px),
        var(--content-width)
      );

      margin: 0 auto;
    }

    .page {
      min-height: calc(100vh - 76px);
      padding: 84px 0 100px;
    }

    .page-header {
      max-width: 760px;
      margin-bottom: 52px;
    }

    .eyebrow {
      margin: 0 0 12px;

      color: var(--color-text-muted);
      font-size: 0.82rem;
      font-weight: 700;

      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .page-title {
      margin: 0;

      font-size: clamp(
        2.4rem,
        6vw,
        5rem
      );

      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    .page-description {
      margin: 22px 0 0;

      color: var(--color-text-soft);
      font-size: 1.08rem;
      max-width: 680px;
    }

    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      min-height: calc(100vh - 76px);

      display: grid;
      place-items: center;

      text-align: center;
    }

    .hero-content {
      max-width: 900px;
    }

    .hero-mark {
      width: 92px;
      height: 92px;

      margin: 0 auto 28px;

      display: grid;
      place-items: center;

      border-radius: 32px;

      background: var(--color-primary);
      box-shadow: var(--shadow-soft);
    }

    .hero-mark svg {
      width: 48px;
      height: 48px;
      stroke-width: 1.5;
    }

    .hero-title {
      margin: 0;

      font-size: clamp(
        3.4rem,
        10vw,
        8rem
      );

      line-height: 0.98;
      letter-spacing: -0.06em;
    }

    .hero-subtitle {
      margin: 22px auto 0;

      color: var(--color-text-soft);
      font-size: clamp(
        1rem,
        2vw,
        1.25rem
      );

      max-width: 620px;
    }

    .hero-actions {
      margin-top: 36px;

      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* =========================================================
       BUTTONS
       ========================================================= */

    .button {
      min-height: 46px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      border: 1px solid var(--color-border);
      border-radius: 14px;

      padding: 10px 17px;

      background: var(--color-surface);
      color: var(--color-text);

      transition:
        transform 180ms ease,
        box-shadow 180ms ease,
        background 180ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-soft);
    }

    .button-primary {
      border-color: transparent;
      background: var(--color-text);
      color: var(--color-surface);
    }

    .button svg {
      width: 17px;
      height: 17px;
    }

    /* =========================================================
       CARDS
       ========================================================= */

    .card-grid {
      display: grid;
      grid-template-columns: repeat(
        3,
        minmax(0, 1fr)
      );

      gap: 18px;
    }

    .card {
      padding: 25px;

      border: 1px solid var(--color-border);
      border-radius: var(--radius-medium);

      background: rgba(
        241,
        237,
        228,
        0.72
      );

      box-shadow:
        0 8px 30px
        rgba(57, 21, 0, 0.035);

      transition:
        transform 220ms ease,
        box-shadow 220ms ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-soft);
    }

    .card-icon {
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      margin-bottom: 18px;

      border-radius: 13px;
      background: var(--color-secondary);
    }

    .card-icon svg {
      width: 20px;
      height: 20px;
    }

    .card-title {
      margin: 0;
      font-size: 1.15rem;
    }

    .card-text {
      margin: 8px 0 0;
      color: var(--color-text-soft);
    }

    .card-meta {
      margin-top: 16px;

      color: var(--color-text-muted);
      font-size: 0.85rem;
    }

    /* =========================================================
       STAT GRID
       ========================================================= */

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(
        4,
        minmax(0, 1fr)
      );

      gap: 14px;
      margin-bottom: 52px;
    }

    .stat {
      padding: 22px;

      border-radius: var(--radius-medium);
      background: rgba(
        241,
        237,
        228,
        0.62
      );

      border: 1px solid var(--color-border);
    }

    .stat-value {
      display: block;

      font-size: 2rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .stat-label {
      display: block;

      margin-top: 6px;

      color: var(--color-text-soft);
      font-size: 0.9rem;
    }

    /* =========================================================
       ISLAND / CLIMATE
       ========================================================= */

    .island-card {
      position: relative;
      overflow: hidden;
    }

    .island-temperature {
      margin-top: 20px;

      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 7px 10px;

      border-radius: 10px;

      background: var(--color-primary);

      font-size: 0.88rem;
      font-weight: 600;
    }

    .island-temperature svg {
      width: 16px;
      height: 16px;
    }

    /* =========================================================
       SEARCH
       ========================================================= */

    .search-bar {
      margin-bottom: 28px;

      position: relative;
    }

    .search-bar svg {
      position: absolute;

      left: 16px;
      top: 50%;

      width: 19px;
      height: 19px;

      transform: translateY(-50%);

      color: var(--color-text-muted);
    }

    .search-input {
      width: 100%;

      min-height: 54px;

      padding:
        12px
        16px
        12px
        48px;

      border: 1px solid var(--color-border);
      border-radius: 16px;

      outline: none;

      background: rgba(
        241,
        237,
        228,
        0.76
      );

      color: var(--color-text);
    }

    .search-input:focus {
      border-color: var(--color-border-strong);
      box-shadow:
        0 0 0 4px
        rgba(180, 189, 203, 0.25);
    }

    /* =========================================================
       FILTERS
       ========================================================= */

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      margin-bottom: 26px;
    }

    .filter-button {
      border: 1px solid var(--color-border);
      border-radius: 999px;

      padding: 7px 13px;

      background: transparent;
      color: var(--color-text-soft);
    }

    .filter-button.active {
      background: var(--color-text);
      color: var(--color-surface);
      border-color: var(--color-text);
    }

    /* =========================================================
       INGREDIENTS
       ========================================================= */

    .ingredient-grid {
      display: grid;

      grid-template-columns: repeat(
        3,
        minmax(0, 1fr)
      );

      gap: 14px;
    }

    .ingredient-card {
      padding: 20px;

      border:
        1px solid
        var(--color-border);

      border-radius: 18px;

      background:
        rgba(
          241,
          237,
          228,
          0.72
        );
    }

    .ingredient-category {
      display: inline-block;

      margin-bottom: 8px;

      color: var(--color-text-muted);

      font-size: 0.78rem;
      font-weight: 700;

      letter-spacing: 0.04em;
    }

    .ingredient-name {
      margin: 0;
      font-size: 1.08rem;
    }

    .ingredient-description {
      margin: 7px 0 0;

      color: var(--color-text-soft);
      font-size: 0.92rem;
    }

    /* =========================================================
       CUISINE
       ========================================================= */

    .dish-card {
      min-height: 240px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .dish-island {
      color: var(--color-text-muted);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .dish-name {
      margin: 8px 0 0;

      font-size: 1.55rem;
    }

    .dish-description {
      margin: 12px 0 0;

      color: var(--color-text-soft);
    }

    .dish-ingredients {
      margin-top: 20px;

      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .ingredient-tag {
      padding: 5px 9px;

      border-radius: 8px;

      background: var(--color-secondary);

      font-size: 0.78rem;
    }

    /* =========================================================
       LANGUAGE
       ========================================================= */

    .language-section {
      margin-top: 54px;
    }

    .section-title {
      margin: 0 0 20px;

      font-size: clamp(
        1.7rem,
        3vw,
        2.4rem
      );

      letter-spacing: -0.03em;
    }

    .language-table-wrap {
      overflow-x: auto;

      border:
        1px solid
        var(--color-border);

      border-radius: 18px;
    }

    .language-table {
      width: 100%;

      border-collapse: collapse;

      min-width: 680px;

      background:
        rgba(
          241,
          237,
          228,
          0.68
        );
    }

    .language-table th,
    .language-table td {
      padding: 14px 16px;

      border-bottom:
        1px solid
        var(--color-border);

      text-align: left;
    }

    .language-table th {
      font-size: 0.83rem;

      color:
        var(--color-text-muted);
    }

    .language-table tr:last-child td {
      border-bottom: 0;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    .site-footer {
      border-top:
        1px solid
        var(--color-border);

      padding: 32px 0 40px;
    }

    .footer-inner {
      width: min(
        calc(100% - 40px),
        var(--content-width)
      );

      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .footer-text {
      margin: 0;

      color: var(--color-text-muted);
      font-size: 0.85rem;
    }

    /* =========================================================
       MOBILE NAV
       ========================================================= */

    @media (max-width: 860px) {
      .main-nav {
        position: absolute;

        left: 20px;
        right: 20px;
        top: 70px;

        display: none;
        flex-direction: column;
        align-items: stretch;

        padding: 10px;

        border:
          1px solid
          var(--color-border);

        border-radius: 18px;

        background:
          rgba(
            241,
            237,
            228,
            0.96
          );

        box-shadow: var(--shadow-soft);
      }

      .main-nav.open {
        display: flex;
      }

      .nav-link {
        text-align: left;
        padding: 12px;
      }

      .mobile-menu-button {
        display: grid;
        place-items: center;
      }

      .header-actions .language-select {
        display: none;
      }

      .card-grid,
      .ingredient-grid {
        grid-template-columns: repeat(
          2,
          minmax(0, 1fr)
        );
      }

      .stat-grid {
        grid-template-columns: repeat(
          2,
          minmax(0, 1fr)
        );
      }
    }

    @media (max-width: 560px) {
      .header-inner,
      main,
      .footer-inner {
        width: min(
          calc(100% - 28px),
          var(--content-width)
        );
      }

      .page {
        padding-top: 58px;
      }

      .hero {
        min-height: calc(100vh - 76px);
      }

      .hero-title {
        font-size: 3.6rem;
      }

      .card-grid,
      .ingredient-grid,
      .stat-grid {
        grid-template-columns: 1fr;
      }

      .footer-inner {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

/* =========================================================
   UTILITIES
   ========================================================= */

let currentLocale =
  localStorage.getItem("sora-locale") ||
  CONFIG.defaultLocale;

function translate(path) {
  const source = I18N[currentLocale];

  return path
    .split(".")
    .reduce(
      (value, key) => value?.[key],
      source
    ) ?? path;
}

function localized(value) {
  if (
    value &&
    typeof value === "object" &&
    !Array.isArray(value)
  ) {
    return (
      value[currentLocale] ||
      value[CONFIG.defaultLocale] ||
      Object.values(value)[0]
    );
  }

  return value;
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function navigate(page) {
  window.location.hash = page;
}

function getCurrentPage() {
  return (
    window.location.hash.replace("#", "") ||
    "home"
  );
}


/* =========================================================
   COMPONENTS
   ========================================================= */

function renderHeader() {
  const pages = [
    ["home", "nav.home"],
    ["climate", "nav.climate"],
    ["ingredients", "nav.ingredients"],
    ["cuisine", "nav.cuisine"],
    ["language", "nav.language"]
  ];

  return `
    <header class="site-header">
      <div class="header-inner">

        <a
          class="brand"
          href="#home"
          aria-label="${CONFIG.siteName}"
        >
          <span class="brand-mark">
            <i data-lucide="cloud"></i>
          </span>

          <span class="brand-name">
            ${CONFIG.siteName}
          </span>
        </a>

        <nav
          class="main-nav"
          id="main-nav"
          aria-label="Main navigation"
        >
          ${pages.map(([page, label]) => `
            <button
              class="nav-link"
              data-page="${page}"
              onclick="navigate('${page}')"
            >
              ${translate(label)}
            </button>
          `).join("")}
        </nav>

        <div class="header-actions">

          <select
            class="language-select"
            id="language-select"
            aria-label="Language"
            onchange="changeLocale(this.value)"
          >
            <option value="zh-TW">繁中</option>
            <option value="zh-CN">简中</option>
            <option value="en">EN</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
          </select>

          <button
            class="mobile-menu-button"
            aria-label="Menu"
            onclick="toggleMobileNav()"
          >
            <i data-lucide="menu"></i>
          </button>

        </div>
      </div>
    </header>
  `;
}

function renderFooter() {
  return `

      <div class="footer-inner">
        <p class="footer-text">

        </p>

        <p class="footer-text">

}

/* =========================================================
   PAGE: INGREDIENTS
   ========================================================= */

function renderIngredientsPage() {
  const categories = [
    "全部",
    ...new Set(
      INGREDIENTS.map(
        ingredient => ingredient.category
      )
    )
  ];

  return `
    <section class="page">

      ${renderPageHeader(
        translate("ingredients.eyebrow"),
        translate("ingredients.title"),
        translate("ingredients.description")
      )}

      <div class="search-bar">

        <i data-lucide="search"></i>

        <input
          id="ingredient-search"
          class="search-input"
          type="search"
          placeholder="${translate("ingredients.search")}"
          oninput="filterIngredients()"
        >

      </div>

      <div class="filter-row">

        ${categories.map(
          category => `
            <button
              class="filter-button ${
                category === "全部"
                  ? "active"
                  : ""
              }"
              data-category="${escapeHtml(category)}"
              onclick="selectIngredientCategory(this)"
            >
              ${
                category === "全部"
                  ? translate("ingredients.all")
                  : escapeHtml(category)
              }
            </button>
          `
        ).join("")}

      </div>

      <div
        class="ingredient-grid"
        id="ingredient-grid"
      >
        ${renderIngredientCards(INGREDIENTS)}
      </div>

    </section>
  `;
}

function renderIngredientCards(items) {
  if (!items.length) {
    return `
      <div class="card">
        <h2 class="card-title">
          No results
        </h2>
      </div>
    `;
  }

  return items.map(ingredient => `
    <article
      class="ingredient-card"
      data-ingredient-card
      data-category="${escapeHtml(ingredient.category)}"
    >
      <span class="ingredient-category">
        ${escapeHtml(ingredient.category)}
      </span>

      <h2 class="ingredient-name">
        ${escapeHtml(ingredient.name)}
      </h2>

      <p class="ingredient-description">
        ${escapeHtml(ingredient.use)}
      </p>
    </article>
  `).join("");
}

let selectedIngredientCategory = "全部";

function filterIngredients() {
  const search =
    document
      .getElementById("ingredient-search")
      ?.value
      .trim()
      .toLowerCase() || "";

  const cards =
    document.querySelectorAll(
      "[data-ingredient-card]"
    );

  cards.forEach(card => {
    const name =
      card
        .querySelector(".ingredient-name")
        ?.textContent
        .toLowerCase() || "";

    const category =
      card.dataset.category || "";

    const matchesSearch =
      !search ||
      name.includes(search);

    const matchesCategory =
      selectedIngredientCategory === "全部" ||
      category === selectedIngredientCategory;

    card.hidden =
      !(matchesSearch && matchesCategory);
  });
}

function selectIngredientCategory(button) {
  document
    .querySelectorAll(".filter-button")
    .forEach(item =>
      item.classList.remove("active")
    );

  button.classList.add("active");

  selectedIngredientCategory =
    button.dataset.category;

  filterIngredients();
}

/* =========================================================
   ROUTER
   ========================================================= */

const PAGES = {
  home: renderHomePage,
  climate: renderClimatePage,
  ingredients: renderIngredientsPage,
  cuisine: renderCuisinePage,
  language: renderLanguagePage
};

function renderApp() {
  const pageName = getCurrentPage();
  const renderPage =
    PAGES[pageName] ||
    PAGES.home;

  document.getElementById("app").innerHTML = `
    ${renderHeader()}

    <main>
      ${renderPage()}
    </main>

    ${renderFooter()}
  `;

  updateActiveNavigation(pageName);
  syncLanguageSelector();
  refreshIcons();
  animatePage();
}

function updateActiveNavigation(pageName) {
  document
    .querySelectorAll(".nav-link")
    .forEach(link => {
      link.classList.toggle(
        "active",
        link.dataset.page === pageName
      );
    });
}

function refreshIcons() {
  if (window.lucide) {
    lucide.createIcons();
  }
}


/* =========================================================
   LANGUAGE
   ========================================================= */

function changeLocale(locale) {
  if (
    !CONFIG.supportedLocales.includes(locale)
  ) {
    return;
  }

  currentLocale = locale;

  localStorage.setItem(
    "sora-locale",
    locale
  );

  renderApp();
}

function syncLanguageSelector() {
  const selector =
    document.getElementById(
      "language-select"
    );

  if (selector) {
    selector.value = currentLocale;
  }
}


/* =========================================================
   MOBILE NAV
   ========================================================= */

function toggleMobileNav() {
  document
    .getElementById("main-nav")
    ?.classList.toggle("open");
}


/* =========================================================
   GSAP
   ========================================================= */

function animatePage() {
  if (!window.gsap) {
    return;
  }

  gsap.from(
    ".page > *, .hero-content > *",
    {
      opacity: 0,
      y: 18,
      duration: 0.55,
      stagger: 0.045,
      ease: "power2.out",
      clearProps: "transform"
    }
  );
}


/* =========================================================
   APPLICATION
   ========================================================= */

function initializeApplication() {
  window.addEventListener(
    "hashchange",
    () => {
      selectedIngredientCategory = "全部";
      renderApp();
    }
  );

  renderApp();
}

initializeApplication();
</script>
